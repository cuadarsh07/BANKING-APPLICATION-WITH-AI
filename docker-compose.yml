services:
  bank-mysql:
    image: mysql:8.0
    container_name: bank_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bankdb
      MYSQL_USER: bankuser
      MYSQL_PASSWORD: bankpassword
    volumes:
      - bank_mysql_data:/var/lib/mysql

volumes:
  bank_mysql_data:

