# -----------------------------------------------------------------------------
# Banking Backend System - MySQL Profile Configuration
# -----------------------------------------------------------------------------
# To activate this profile, set:
#   spring.profiles.active=mysql
# or run with:
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# -----------------------------------------------------------------------------

# MySQL Datasource (Make sure database 'banking_db' exists in MySQL!)
# CREATE DATABASE banking_db;
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable H2 console in MySQL profile
spring.h2.console.enabled=false
